<text x="986" y="790" font-size="11" fill="#7c2d12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-weight="400">• DHCP + NAT/PAT assurés par le routeur 1941</text>
<text x="986" y="810" font-size="11" fill="#7c2d12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-weight="400">• Portables = clients Wi-Fi de l'AP → adressés en VLAN 20</text>
<text x="986" y="830" font-size="11" fill="#7c2d12" text-anchor="start" font-family="Segoe UI,Arial,sans-serif" font-weight="400">• Piège du sujet levé : VLAN 10=PC fixes / VLAN 20=Wi-Fi</text>
